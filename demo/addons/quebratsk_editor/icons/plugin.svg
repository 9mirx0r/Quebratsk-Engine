<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222a"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Tech Plate -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bgGrad)" stroke="#3a4150" stroke-width="2"/>
  
  <!-- Outer Tech Accents -->
  <path d="M 12 6 L 52 6 L 58 12 L 58 52 L 52 58 L 12 58 L 6 52 L 6 12 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.6"/>

