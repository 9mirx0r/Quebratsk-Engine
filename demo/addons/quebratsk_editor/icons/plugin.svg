  <!-- Bold Lambda Logo (λ) -->
  <path d="M 32 18 L 38 18 L 42 27 L 49 44 L 41 44 L 37 35 L 27 35 L 21 44 L 15 44 L 28 18 Z M 30 28 L 35 28 L 32 20 Z" fill="url(#amberGrad)"/>

  <!-- Core Circuit Dots -->
  <circle cx="16" cy="16" r="2" fill="#4cc9f0"/>
  <circle cx="48" cy="16" r="2" fill="#4cc9f0"/>
  <circle cx="16" cy="48" r="2" fill="#ffb703"/>
  <circle cx="48" cy="48" r="2" fill="#ffb703"/>
</svg>
