name: Build and test

# Everything in this project was previously verified on one developer's machine. That is
# how a release DLL shipped as a byte-identical copy of the debug build, twice, and how a
# .gdextension manifest that silently failed to load reached two releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # godot-cpp is pulled in by FetchContent and is by far the longest part of a cold
      # build, so its build tree is cached against the CMake files that select it.
      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build-release/_deps
          key: godot-cpp-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Debug)
        run: cmake -S . -B build

      - name: Build (Debug)
        run: cmake --build build --config Debug

      - name: Test
        working-directory: build
        run: ctest -C Debug --output-on-failure

      # Release is configured into its own tree on purpose. godot-cpp 4.3 reads
      # CMAKE_BUILD_TYPE, which is empty under a multi-config generator, so it defaults to
      # Debug and bakes /MDd into the "release" build — which then fails to link against
      # the release CRT.
      - name: Configure (Release)
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build-release --config Release

      # The two binaries being identical is not hypothetical: it has happened twice, and
      # both times shipped. A debug DLL is ~10x the size and carries the debug CRT.
      - name: Verify the release binary is not a debug build
        shell: pwsh
        run: |
          $debug   = Get-FileHash demo/bin/libquebratsk.windows.debug.x86_64.dll
          $release = Get-FileHash demo/bin/libquebratsk.windows.release.x86_64.dll
          $size    = (Get-Item demo/bin/libquebratsk.windows.release.x86_64.dll).Length
          if ($debug.Hash -eq $release.Hash) {
            throw "release DLL is byte-identical to the debug DLL"
          }
          if ($size -gt 3MB) {
            throw "release DLL is $([math]::Round($size/1MB,1)) MB; a debug build leaked into it"
          }
          Write-Host "release DLL $([math]::Round($size/1KB)) KB, distinct from debug"

      # A '#' comment in a .gdextension is a parse error that silently drops the keys
      # around it. That is exactly how compatibility_minimum went missing and stopped the
      # extension loading in v0.3.0 and v0.4.0.
      - name: Verify the GDExtension manifest
        shell: pwsh
        run: |
          $text = Get-Content demo/bin/quebratsk.gdextension -Raw
          if ($text -match '(?m)^\s*#') {
            throw "quebratsk.gdextension uses '#' comments; Godot's ConfigFile needs ';'"
          }
          if ($text -notmatch 'compatibility_minimum') {
            throw "quebratsk.gdextension is missing compatibility_minimum"
          }
          Write-Host "manifest OK"

      - name: Upload the addon
        uses: actions/upload-artifact@v4
        with:
          name: quebratsk-addon-windows
          path: |
            demo/bin/libquebratsk.windows.release.x86_64.dll
            demo/bin/libquebratsk.windows.debug.x86_64.dll
            demo/bin/quebratsk.gdextension
            demo/addons/quebratsk_editor/

  gdscript:
    name: GDScript parses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The dock is GDScript, and a parse error there takes the whole plugin down without
      # touching a line of C++ — a PackedStringArray inside a const did exactly that.
      # Godot reports script errors on a headless editor pass; the GDExtension itself
      # cannot load on Linux (Windows binaries), which does not affect parsing.
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Check for script errors
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --quit-after 120 \
            --path demo 2>&1 | tee godot.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" godot.log; then
            echo "::error::GDScript failed to parse"
            exit 1
          fi
          echo "no script errors"
